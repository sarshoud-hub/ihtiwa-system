  --lead: #A495E8; --lead-soft: #25213D; --dep: #74A7CC; --dep-soft: #18283A; color-scheme: dark; } }

  --accent: #4DB39B; --accent-soft: #17322B; --on-accent: #0E1412;
  --good: #6CC48A; --good-soft: #17301F; --warn: #E3A653; --warn-soft: #33281A; --bad: #E57B73; --bad-soft: #3A1E1C;

}

<style>
/* Layout: the calendar sheet itself — one wide grid of 12 month bands (Day / Hijri / Topic / Content), scrolling sideways inside its own box. */
:root {
  --c-navy: #1763A0; --c-day: #E3F1FB; --c-hij: #FEF3E0; --c-int: #96CAED; --c-dig: #FBB03F; --c-coral: #F26C5B;
  --c-grid: #D0D3D8; --c-num: #424344; --c-hijt: #6D6E71; --c-cell: #FFFFFF; --c-label-ink: #1763A0;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --c-day: #17304A; --c-hij: #2B2416; --c-grid: #2C3A4C; --c-num: #E5ECF4; --c-hijt: #C9B58E; --c-cell: #151E29; --c-label-ink: #9CC6EC; } }
:root[data-theme="dark"] { --c-day: #17304A; --c-hij: #2B2416; --c-grid: #2C3A4C; --c-num: #E5ECF4; --c-hijt: #C9B58E; --c-cell: #151E29; --c-label-ink: #9CC6EC; }
.cal-app { max-width: none; }
.legend-box { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--panel); direction: ltr; }
.lg-t { font-weight: 600; color: var(--c-label-ink); }
.lg { display: inline-flex; align-items: center; gap: 5px; }
.lg i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; border: 1px solid var(--c-grid); }
.mjump { display: flex; gap: 6px; flex-wrap: wrap; direction: ltr; justify-content: flex-end; }
.mjump button { font: inherit; font-size: .82rem; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 7px; padding: 4px 10px; cursor: pointer; }
.mjump button:hover { border-color: var(--accent); }
.cal-wrap { direction: ltr; overflow: auto; max-height: calc(100vh - 180px); border: 1px solid var(--line); border-radius: 10px; background: var(--c-cell); }
table.cal { border-collapse: separate; border-spacing: 0; font-family: Arial, "IBM Plex Sans Arabic", sans-serif; font-size: 12px; table-layout: fixed; width: max-content; }
table.cal col.cm { width: 104px; } table.cal col.cl { width: 66px; } table.cal col.cd { width: 96px; }
.cal td, .cal th { border-right: 1px solid var(--c-grid); border-bottom: 1px solid var(--c-grid); text-align: center; vertical-align: middle; padding: 3px 4px; overflow: hidden; }
.cal .mlab { color: #fff; font-weight: 700; font-size: 12.5px; line-height: 1.5; white-space: pre-line; position: sticky; left: 0; z-index: 3; }
.cal .rl { background: var(--c-day); color: var(--c-label-ink); font-weight: 700; position: sticky; left: 104px; z-index: 2; }
.cal .wk { background: var(--c-navy); color: #fff; font-weight: 700; height: 22px; }
.cal .wd { background: var(--c-day); color: var(--c-label-ink); height: 22px; }
.cal .dn { color: var(--c-num); font-weight: 700; font-size: 13px; height: 22px; background: var(--c-cell); }
.cal .hj { background: var(--c-hij); color: var(--c-hijt); font-size: 11px; height: 20px; direction: rtl; }
.cal .tp, .cal .ct { height: 40px; background: var(--c-cell); color: var(--fg); direction: rtl; font-size: 11.5px; line-height: 1.35; word-break: break-word; }
.cal .tp { font-weight: 600; }
.cal .ct { font-size: 11px; color: var(--muted); }
.cal .x { background: var(--bg); border-right-color: transparent; border-bottom-color: transparent; }
.cal tr.mend td { border-bottom: 2px solid var(--c-navy); }
.cal .t-internal { background: var(--c-int); color: #1F2A44; }
.cal .t-digital { background: var(--c-dig); color: #1F2A44; }
.cal .t-internal.ct, .cal .t-digital.ct { color: #1F2A44; }
.cal .ed { cursor: pointer; }
.cal .ed:hover { box-shadow: inset 0 0 0 2px var(--accent); }
.cal .ed:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

      if (d > n) { [1, 2, 3, 4, 5].forEach((r) => rows[r].append(el('td', '', 'x'))); continue; }
      const x = M.days[d - 1]; const we = x.wd === 'Friday' || x.wd === 'Saturday';
      rows[1].append(el('td', x.wd, 'wd' + (we ? ' wkend' : ''))); rows[2].append(el('td', String(d), 'dn' + (we ? ' wkend' : ''))); rows[3].append(el('td', x.h, 'hj'));
      const e = entry(m, d); const tc = e.type ? ' t-' + e.type : '';
      ['tp', 'ct'].forEach((cls, i) => {
        const c = el('td', i ? e.content : e.topic, cls + tc); c.dataset.m = m; c.dataset.d = d; c.title = `${x.wd} ${d} ${M.en} · ${x.h}`;
        if (S.canEdit) { c.classList.add('ed'); c.tabIndex = 0; c.setAttribute('role', 'button'); c.setAttribute('aria-label', `${i ? 'Content' : 'Topic'} ${d} ${M.en}`); }
        rows[4 + i].append(c);
      });
    }
    tb.append(...rows);
  });
  t.append(tb);
  const filled = Object.values(S.docs).filter((v) => v.topic || v.content).length;
  $('hint').textContent = S.canEdit ? `اضغط على خانة Topic أو Content لأي يوم لتعبئتها واختيار لونها. ${filled ? `معبّأ ${filled} يوماً.` : ''}` : (filled ? `معبّأ ${filled} يوماً.` : 'التعبئة متاحة للإدارة.');
}

// ---------- editor
const pop = $('pop');
function openPop(cell) {
  const m = Number(cell.dataset.m), d = Number(cell.dataset.d); const x = MONTHS[m].days[d - 1]; const e = entry(m, d);
  S.open = { m, d }; $('pop-t').textContent = `${x.wd} ${d} ${MONTHS[m].en} 2027`; $('pop-h').textContent = x.h;
  $('p-topic').value = e.topic || ''; $('p-content').value = e.content || ''; setType(e.type || '');
  pop.hidden = false;
  const r = cell.getBoundingClientRect(); const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = Math.min(Math.max(16, r.left), innerWidth - pw - 16); let top = r.bottom + 6; if (top + ph > innerHeight - 16) top = Math.max(16, r.top - ph - 6);
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
  (cell.classList.contains('ct') ? $('p-content') : $('p-topic')).focus();
}
function closePop() { pop.hidden = true; S.open = null; }
function setType(v) { S.type = v; $('p-type').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === v))); }
$('p-type').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setType(b.dataset.v); });
$('cal').addEventListener('click', (e) => { const c = e.target.closest('td.ed'); if (c) openPop(c); });
$('cal').addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('td.ed')) { e.preventDefault(); openPop(e.target); } });
$('p-cancel').addEventListener('click', closePop);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !pop.hidden) closePop(); });
document.addEventListener('mousedown', (e) => { if (!pop.hidden && !pop.contains(e.target) && !e.target.closest('td.ed')) closePop(); });
async function write(data) {
  const { m, d } = S.open; const k = key(m, d); const btns = pop.querySelectorAll('button'); btns.forEach((b) => { b.disabled = true; });
  try { await S.db.collection('days').doc(k).set({ ...data, date: k, updated: new Date().toISOString() }); closePop(); say(''); }
  catch (e) { say('تعذر الحفظ. تحقق من الاتصال وصلاحية التعديل ثم أعد المحاولة.', true); }
  finally { btns.forEach((b) => { b.disabled = false; }); }
}
$('p-save').addEventListener('click', () => write({ topic: $('p-topic').value.trim(), content: $('p-content').value.trim(), type: S.type }));
$('p-topic').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); $('p-save').click(); } });
$('p-clear').addEventListener('click', () => write({ topic: '', content: '', type: '' }));

// ---------- month jump
$('mjump').replaceChildren(...MONTHS.map((M, m) => { const b = el('button', `${M.en} · ${MN[m]}`); b.type = 'button'; b.addEventListener('click', () => { const r = $('m' + (m + 1)); const w = $('wrap'); w.scrollTo({ top: r.offsetTop - 2, behavior: 'smooth' }); }); return b; }));

// ---------- Excel, in the same layout as the original sheet
$('dl').addEventListener('click', async () => {
  if (!window.ExcelJS) { say('تعذر تحميل مكتبة Excel. أعد فتح الصفحة.', true); return; }
  const dl = S.dl || await claude.use('downloads'); if (!dl) { say('التحميل غير متاح في هذا العرض.', true); return; }
  const wb = new ExcelJS.Workbook(); const ws = wb.addWorksheet('Calendar 2027');
  const thin = { style: 'thin', color: { argb: 'FFD0D3D8' } }; const B = { top: thin, left: thin, bottom: thin, right: thin };
  const fill = (c) => ({ type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF' + c } });
  const put = (r, c, v, o) => { const cell = ws.getCell(r, c); cell.value = v; cell.border = B; cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true }; cell.font = { name: 'Arial', size: o.size || 10, bold: !!o.b, color: { argb: 'FF' + (o.color || '000000') } }; if (o.fill) cell.fill = fill(o.fill); return cell; };
  ws.getColumn(1).width = 14; ws.getColumn(2).width = 9; for (let c = 3; c <= 33; c++) ws.getColumn(c).width = 12.5; ws.getColumn(36).width = 4; ws.getColumn(37).width = 16;
  ws.mergeCells(1, 3, 1, 33); put(1, 3, 'تقويم احتواء 2027 م  |  1448 - 1449 هـ', { size: 18, b: true, color: '1763A0' }).border = {}; ws.getRow(1).height = 62;
  put(2, 36, 'Color code', { b: true, color: '1763A0' }); ws.mergeCells(2, 36, 2, 38);
  put(3, 36, null, { fill: '96CAED' }); put(3, 37, 'Internal event', {}); put(4, 36, null, { fill: 'FBB03F' }); put(4, 37, 'Digital post', {});
  MONTHS.forEach((M, m) => {
    const r = 2 + m * 6; const n = M.days.length;
    ws.mergeCells(r, 1, r + 5, 1); put(r, 1, `${M.en}\n${M.hm}\n${M.hy}`, { size: 11, b: true, color: M.ink, fill: M.fill });
    ws.mergeCells(r, 2, r + 2, 2); put(r, 2, 'Day', { b: true, color: '1763A0', fill: 'E3F1FB' });
    put(r + 3, 2, 'Hijri', { b: true, color: '1763A0', fill: 'E3F1FB' }); put(r + 4, 2, 'Topic', { b: true, color: '1763A0', fill: 'E3F1FB' }); put(r + 5, 2, 'Content', { b: true, color: '1763A0', fill: 'E3F1FB' });
    for (let w = 0; w * 7 < n; w++) { const a = 3 + w * 7, z = 3 + Math.min(n, w * 7 + 7) - 1; if (z > a) ws.mergeCells(r, a, r, z); put(r, a, `Week ${w + 1}`, { b: true, color: 'FFFFFF', fill: '1763A0' }); }
    M.days.forEach((x, i) => {
      const c = 3 + i; const e = entry(m, i + 1); const tf = e.type === 'internal' ? '96CAED' : e.type === 'digital' ? 'FBB03F' : null;
      put(r + 1, c, x.wd, { color: '1763A0', fill: 'E3F1FB' }); put(r + 2, c, i + 1, { size: 11, b: true, color: '424344' }); put(r + 3, c, x.h, { size: 9, color: '6D6E71', fill: 'FEF3E0' });
      put(r + 4, c, e.topic || null, { fill: tf }); put(r + 5, c, e.content || null, { size: 9, fill: tf });
    });
    ws.getRow(r + 4).height = 30; ws.getRow(r + 5).height = 30;
  });
  const buf = await wb.xlsx.writeBuffer();
  try { await dl.save({ filename: 'Ihtiwa_Calendar_2027.xlsx', data: new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }) }); }
  catch (e) { if (e && e.code !== 'declined') say('تعذر تحميل الملف.', true); }
});

// ---------- boot
render();
if (!window.claude || !window.claude.use) { say('تعذر الوصول إلى بيانات التقويم.', true); return; }
(async () => {
  const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
  claude.use('downloads').then((d) => { S.dl = d; }).catch(() => {});
  if (!db) { say('سجّل الدخول لعرض التقويم المعبّأ.', true); return; }
  S.db = db; S.canEdit = user ? await user.canEdit() : false; render();
  db.collection('days').onSnapshot((s) => { const o = {}; s.docs.forEach((d) => { o[d.id] = d.data(); }); S.docs = o; render(); }, () => say('انقطع تحديث التقويم. أعد فتح الصفحة.', true));
})();
})();
</script>

</body></html>
